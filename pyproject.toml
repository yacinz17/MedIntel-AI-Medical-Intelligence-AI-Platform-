[project]
name = "medintel-ai"
version = "0.1.0"
description = "Portfolio-ready medical AI prototype with FastAPI and Streamlit"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=1.26,<2.1",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "pillow>=10.4,<12.0",
  "streamlit>=1.38,<2.0",
  "requests>=2.32,<3.0"
]

[project.optional-dependencies]
image = ["tensorflow>=2.17,<2.20"]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
